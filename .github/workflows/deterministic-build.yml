name: Deterministic Build

on:
  push:
    tags: ['v*'] # Only auto-trigger on tagged releases
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch, or commit to build (default: master)'
        required: false
        default: 'master'

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: deterministic-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # User-controlled values reach the shell only through env, and are
      # validated before use (no ${{ }} interpolation inside run:).
      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${INPUT_REF:-}" ]]; then
            version="$INPUT_REF"
          else
            version="$GITHUB_REF_NAME"
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]; then
            echo "::error::Refusing unexpected ref name"
            exit 1
          fi
          # artifact names cannot contain '/'
          echo "version=${version//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build deterministic packages
        run: bash scripts/deterministic-build.sh

      - name: Show hashes
        run: cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-build-${{ steps.version.outputs.version }}
          path: |
            ssp-wallet-*.zip*
            SHA256SUMS
          if-no-files-found: error

  release:
    # Tag pushes only; manual runs never publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    # Configure required reviewers on this environment in the repo settings.
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deterministic-build-${{ needs.build.outputs.version }}
          path: release

      - name: Verify hashes
        working-directory: release
        run: sha256sum -c SHA256SUMS

      # Signs SHA256SUMS only when a release key is configured. Without one,
      # no .asc is produced and the release notes do not mention GPG.
      - name: Sign SHA256SUMS
        id: sign
        working-directory: release
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "::warning::RELEASE_GPG_PRIVATE_KEY is not set; SHA256SUMS is not GPG-signed"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE:-}" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/ssp-wallet-chrome-*.zip
            release/ssp-wallet-firefox-*.zip
            release/SHA256SUMS

      # gh is preinstalled on the runner: no third-party release action holds
      # the write token.
      - name: Create release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          set -euo pipefail
          files=("ssp-wallet-chrome-${VERSION}.zip" "ssp-wallet-firefox-${VERSION}.zip" SHA256SUMS)
          {
            echo "## Deterministic Build - ${VERSION}"
            echo
            echo "This release contains deterministic builds for both Chrome and Firefox."
            echo
            echo "**Files verification:** \`sha256sum -c SHA256SUMS\`"
            echo
            echo "**Provenance:** \`gh attestation verify ssp-wallet-chrome-${VERSION}.zip --repo ${GITHUB_REPOSITORY}\`"
            if [[ "$SIGNED" == "true" ]]; then
              echo
              echo "**GPG verification:** \`gpg --verify SHA256SUMS.asc SHA256SUMS\`"
            fi
            echo
            echo "**Reproduction:** \`git checkout ${VERSION} && yarn build:deterministic\`"
          } > notes.md
          if [[ "$SIGNED" == "true" ]]; then
            files+=(SHA256SUMS.asc)
          fi
          gh release create "$VERSION" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$VERSION" --notes-file notes.md
